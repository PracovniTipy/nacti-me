<style>
/* Layout: jeden úzký sloupec. Nahoře kód, pod ním jedno pole, pod tím tisk. Nic navíc. */
:root {
  --bg: #f3f3f1;
  --fg: #111113;
  --muted: #74747b;
  --line: #dcdcd8;
  --field: #ffffff;
  --paper: #ffffff;
  --ok: #157a43;
  --warn: #a35a00;
  --shadow: 0 1px 1px rgba(17,17,19,.04), 0 18px 50px -18px rgba(17,17,19,.22);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0c0e; --fg: #f2f2f0; --muted: #8e8e95; --line: #27272c; --field: #151518;
    --ok: #5fd08f; --warn: #f0b35a;
    --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -20px rgba(0,0,0,.8); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0c0e; --fg: #f2f2f0; --muted: #8e8e95; --line: #27272c; --field: #151518;
  --ok: #5fd08f; --warn: #f0b35a;
  --shadow: 0 0 0 1px rgba(255,255,255,.04), 0 24px 60px -20px rgba(0,0,0,.8); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

.app { max-width: 440px; margin: 0 auto; display: grid; gap: 28px; padding-block: 20px 56px; }
.brand { font-family: var(--sans); font-size: 17px; font-weight: 700; letter-spacing: -.02em; text-transform: none; color: var(--fg); }
.brand em { font-style: normal; color: var(--muted); font-weight: 500; }
.mark { align-items: baseline; font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }

/* Kód */
.code { position: relative; width: 100%; aspect-ratio: 1; background: var(--paper); border-radius: 22px; box-shadow: var(--shadow); }
.code canvas, .code img { position: absolute; inset: 7%; width: 86%; height: 86%; display: block; }
.code img { opacity: 0; -webkit-touch-callout: default; }
.code img.ready { opacity: 1; }
.code .idle { position: absolute; inset: 0; display: grid; place-items: center; color: #9a9aa0; font-size: 14px; text-align: center; padding: 20%; }
.caption { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 18px; margin-top: -16px; font-variant-numeric: tabular-nums; }
.caption b { color: var(--fg); font-weight: 500; letter-spacing: .06em; text-transform: uppercase; flex: none; }
.caption span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Vstup */
.block { display: grid; gap: 12px; }
.modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: var(--line); padding: 2px; border-radius: 11px; }
.modes button { border: 0; background: transparent; padding: 8px 2px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--field); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.field { display: grid; gap: 8px; }
.field.grid2 { grid-template-columns: 1fr 1fr; }
.field.grid2 .wide { grid-column: 1 / -1; }
@media (max-width: 400px) { .field.grid2 { grid-template-columns: 1fr; } }
.field input, .field textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--field); border-radius: 14px;
  padding: 15px 16px; font-size: 17px; line-height: 1.4; resize: none; transition: border-color .15s;
}
.field input.num { font-variant-numeric: tabular-nums; }
.field textarea { min-height: 56px; max-height: 160px; overflow-y: auto; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--fg); }
.field input[aria-invalid="true"] { border-color: var(--warn); }
.field ::placeholder { color: var(--muted); }
.drop { display: grid; justify-items: center; gap: 4px; padding: 26px 16px; border: 1.5px dashed var(--line); border-radius: 14px; background: var(--field); cursor: pointer; text-align: center; }
.drop:hover, .drop:focus-within { border-color: var(--fg); }
.drop b { font-size: 16px; font-weight: 600; }
.drop span { font-size: 13px; color: var(--muted); }
.thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.thumbs:empty { display: none; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.up img { opacity: .4; }
.thumb.up::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; border: 2px solid #fff; border-top-color: transparent; animation: spin .8s linear infinite; }
.thumb.err { outline: 2px solid var(--warn); outline-offset: -2px; }
.thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; cursor: pointer; }
.err { margin: -2px 2px 0; font-size: 13px; color: var(--warn); }

.row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.inks { display: flex; gap: 10px; }
.inks button { width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); box-shadow: 0 0 0 1px color-mix(in srgb, var(--muted) 55%, transparent); }
.inks button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
.check-line { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.check-line.ok::before { content: "● "; color: var(--ok); }

.save { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.dl { border: 0; border-radius: 14px; padding: 16px 20px; font-size: 16px; font-weight: 600; cursor: pointer; background: var(--fg); color: var(--bg); transition: transform .12s, opacity .15s; }
.dl.alt { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .06em; }
.dl:active:not(:disabled) { transform: scale(.98); }
.dl:disabled { opacity: .35; cursor: default; }

/* Tisk */
.print { display: grid; gap: 14px; padding-top: 22px; border-top: 1px solid var(--line); }
.print h2 { font-size: 13px; font-weight: 600; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.print h2 span { font-family: var(--mono); font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.formats { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.formats button { border: 0; border-radius: 14px; padding: 14px 8px 12px; cursor: pointer; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); display: grid; justify-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--fg); }
.formats button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--fg); }
.formats i { display: block; border: 1.5px solid currentColor; border-radius: 3px; opacity: .8; }
.formats small { font-family: var(--mono); font-size: 10px; color: var(--muted); font-weight: 400; }
.brief { width: 100%; border: 1px solid var(--line); background: var(--field); border-radius: 14px; padding: 14px 16px; font-size: 16px; line-height: 1.4; resize: none; color: var(--fg); }
.brief:focus { outline: none; border-color: var(--fg); }
.brief::placeholder { color: var(--muted); }
.ai { border: 0; border-radius: 14px; padding: 15px 18px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--fg); background: var(--field); box-shadow: inset 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: center; gap: 10px; }
.ai:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--fg); }
.ai:disabled { opacity: .5; cursor: default; }
.ai svg { width: 16px; height: 16px; flex: none; }
.ai.busy svg { animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.out { display: grid; gap: 12px; }
.out .pv { display: grid; place-items: center; background: var(--field); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); padding: 18px; }
.out img { max-width: 100%; max-height: 520px; border-radius: 6px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.35); display: block; }
.tune { display: grid; gap: 14px; padding: 16px; border-radius: 14px; background: var(--field); box-shadow: inset 0 0 0 1px var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none; }
.tune-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 400px) { .tune-row { grid-template-columns: 1fr; } }
.tune label { display: grid; gap: 6px; font-size: 12px; font-weight: 500; color: var(--muted); min-width: 0; }
.tune label output { font-family: var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
.tune select, .tune input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; color: var(--fg); }
.tune input[type="range"] { width: 100%; accent-color: var(--fg); }
.tune .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); }
.tune .check input { width: 18px; height: 18px; accent-color: var(--fg); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.verdict { font-family: var(--mono); font-size: 12px; margin: 0; }
.verdict.ok { color: var(--ok); }
.verdict.warn { color: var(--warn); }

.partner { display: block; text-align: center; padding: 14px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px; }
.partner:hover { box-shadow: inset 0 0 0 1px var(--fg); }
.promise { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (prefers-reduced-motion: reduce) { .ai.busy svg { animation: none; } .field input, .field textarea, .dl { transition: none; } }
</style>

<main class="app">
  <div class="mark"><span class="brand">Načti<em>.me</em></span><span>BrosWars Studio</span></div>

  <div class="code">
    <canvas id="cv" aria-hidden="true"></canvas>

          <label for="tDisplay">Písmo nadpisu<select id="tDisplay"></select></label>

        </div>
        <div class="tune-row">
          <label for="tName">Velikost nadpisu <output id="tNameV">100 %</output><input type="range" id="tName" min="60" max="140" step="5" value="100"></label>
          <label for="tSize">Velikost údajů <output id="tSizeV">100 %</output><input type="range" id="tSize" min="70" max="140" step="5" value="100"></label>

</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  // ================= Nastavení =================
  // Úložiště fotek (Supabase Storage, složka nacti-fotky). Veřejný klíč je určený pro prohlížeč.
  const PHOTO_API = 'https://smjplqxwqyraphfeqsyk.supabase.co';
  const PHOTO_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNtanBscXh3cXlyYXBoZmVxc3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5MjA3NzMsImV4cCI6MjEwODQ5Njc3M30.X6VUO5NSdJFG4E00aAALSDkW39JqANjQmk0dees_Q78';
  const PHOTO_VIEW = 'https://nacti.me/f/';
  const MAX_PHOTOS = 10;
  const canUpload = !window.claude && /^https?:$/.test(location.protocol);

  // Partnerský (affiliate) odkaz na tiskárnu. Po registraci v partnerském programu sem vložte svůj odkaz – tlačítko se samo zobrazí.
  const PRINT_PARTNER_URL = '';
  if (PRINT_PARTNER_URL) { const a = $('partner'); a.href = PRINT_PARTNER_URL; a.hidden = false; }

  // ================= Stav =================
  const INKS = [['Černá', '#111113'], ['Indigo', '#3730a3'], ['Lesní', '#14532d'], ['Bordó', '#7f1d1d'], ['Oceán', '#0c4a6e']];
  let ink = INKS[0][1], mode = 'card', current = null, prev = null;
  const values = {
    any: 'broswars.cz',
    wifi: { ssid: '', pass: '' },
    card: { name: '', title: '', org: '', tel: '', email: '', web: '', addr: '' },
    pay: { acc: '', amount: '', vs: '', msg: '' },
    photo: { items: [] },
  };

  // ================= Formáty obsahu =================
  const wEsc = (s) => s.replace(/([\\;,:"])/g, '\\$1');
  const vEsc = (s) => s.replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1');
  const webUrl = (w) => (/^https?:\/\//i.test(w) ? w : 'https://' + w);
  const fmtPhone = (p) => {
    const d = (p || '').replace(/[^\d+]/g, ''); if (!d) return '';
    const plus = d.startsWith('+'), digits = d.replace(/\+/g, ''), g = (s) => s.replace(/(\d{3})(?=\d)/g, '$1 ');
    if (plus && digits.startsWith('420') && digits.length === 12) return '+420 ' + g(digits.slice(3));
    if (!plus && digits.length === 9) return g(digits);
    return (plus ? '+' : '') + g(digits);
  };
  const fmtWeb = (w) => (w || '').trim().replace(/^https?:\/\//i, '').replace(/\/$/, '').toLowerCase();
  const fmtMoney = (n) => n.toLocaleString('cs-CZ', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' Kč';

  // České číslo účtu → IBAN (s kontrolou podle ČNB)
  function toIban(raw) {
    const a = raw.replace(/\s+/g, '').toUpperCase();
    if (/^CZ\d{22}$/.test(a)) {
      const r = BigInt(a.slice(4) + '1235' + a.slice(2, 4)) % 97n;
      return r === 1n ? { iban: a } : { error: 'IBAN nemá platný kontrolní součet.' };
    }
    const m = a.match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/);
    if (!m) return { error: 'Zadejte účet ve tvaru 123456789/0800 nebo IBAN.' };
    const pre = (m[1] || '').padStart(6, '0'), num = m[2].padStart(10, '0'), bank = m[3];
    const w = [6, 3, 7, 9, 10, 5, 8, 4, 2, 1];
    const ok = (s) => [...s].reduce((sum, c, i) => sum + Number(c) * w[i], 0) % 11 === 0;
    if (!ok(pre.padStart(10, '0')) || !ok(num)) return { error: 'Číslo účtu nesedí. Zkontrolujte překlep.' };
    const bban = bank + pre + num;
    const ck = String(98n - (BigInt(bban + '123500') % 97n)).padStart(2, '0');
    return { iban: 'CZ' + ck + bban };
  }

  const plural = (n, a, b, c) => (n === 1 ? a : n < 5 ? b : c);
  function detect() {
    if (mode === 'photo') {
      const ok = values.photo.items.filter((i) => i.status === 'ok');
      if (!ok.length) return null;
      const label = `${ok.length} ${plural(ok.length, 'fotka', 'fotky', 'fotek')}`;
      return { kind: 'Fotky', summary: label, data: PHOTO_VIEW + '?p=' + ok.map((i) => i.id).join('.'), details: [['Fotky', label]] };
    }
    if (mode === 'wifi') {
      const { ssid, pass } = values.wifi;
      if (!ssid.trim()) return null;
      return { kind: 'Wi-Fi', summary: ssid, data: pass ? `WIFI:T:WPA;S:${wEsc(ssid)};P:${wEsc(pass)};;` : `WIFI:T:nopass;S:${wEsc(ssid)};;`,
        details: [['Síť', ssid], ...(pass ? [['Heslo', pass]] : [])] };
    }

        glass(x, pX - 26, pY - 26, pS + 52, 44); qr(pX + 30, pY + 30, pS - 60, true, 24);
        const maxW = pX - P - 110;
        fill(inkA); x.globalAlpha = 0.75; setLabel(26); txt(x, (sub.join('  ·  ') || ' ').toLocaleUpperCase('cs'), P, P + 40, 5); x.globalAlpha = 1;
        const nm = caseIt(full); const ns = fitSize(x, nm, maxW, 170 * NS, 64, setName, nameTr); txt(x, nm, P, H * 0.5 + ns * 0.3, nameTr(ns));
        if (d.tagline) { setItalic(48); x.globalAlpha = 0.85; txt(x, d.tagline, P, H * 0.5 + ns * 0.3 + 86); x.globalAlpha = 1; }
        const keep = d.accent; d.accent = inkA; detailRows(P, H - P - rowsH(56), maxW, 36, 56, d.bg, 64, 'left', inkA); d.accent = keep;
      } else {
        const panel = Math.round(W * 0.36), px = W - panel;
        fill(d.accent); x.fillRect(px, 0, panel, H);
        const qS = 440; qr(px + (panel - qS) / 2, (H - qS) / 2 - 20, qS, true, 22);
        fill(on(d.accent)); setLabel(24); txt(x, 'NASKENUJTE · ULOŽTE', px + panel / 2, (H + qS) / 2 + 40, 6, 'center');
        const maxW = px - P - 90; fill(d.ink);
        const nm = caseIt(full); const ns = fitSize(x, nm, maxW, 150 * NS, 60, setName, nameTr); txt(x, nm, P, P + ns * 0.8, nameTr(ns));
        let y = P + ns * 0.8 + 44; fill(ratio(d.accent, d.bg) >= 3 ? d.accent : d.ink); x.fillRect(P, y, 90, 6); y += 74;
        if (sub.length) { setText(42); fill(rgba(d.ink, 0.7)); fitSize(x, sub.join('  ·  '), maxW, 42, 26, (z) => setText(z)); txt(x, sub.join('  ·  '), P, y, 0.4); y += 66; }
        if (d.tagline) { setItalic(48); fill(d.ink); txt(x, d.tagline, P, y); }
        detailRows(P, H - P - rowsH(58), maxW, 38, 58, d.bg);
      }
      return cvs;
    }

    // ---------------- KARTIČKA A6 ----------------
    if (fmt === 'a6') {
      const P = 104, maxW = W - P * 2;
      const kicker = (mode === 'pay' && current.amount ? 'K ÚHRADĚ' : current.kind.toLocaleUpperCase('cs'));
      const dRows = details.filter(([k]) => !(mode === 'pay' && k === 'Částka'));
      const realDetails = details; // pro výšku
      if (d.layout === 'editorial') {
        fill(labelColor(d.bg)); setLabel(24); txt(x, kicker, P, P + 20, 7);
        fill(d.ink); const hd = fitWrap(x, head, maxW, 190 * NS, 70, 2, setName);
        let y = P + 40 + hd.s * 0.85;
        hd.lines.forEach((l, i) => { if (i === 1 && D.it) setFont(x, 400, hd.s, d.display, D.fb, true); if (i === 1) fill(ratio(d.accent, d.bg) >= 3 ? d.accent : d.ink); txt(x, l, P - hd.s * 0.02, y, nameTr(hd.s)); y += hd.s * 0.92; setName(hd.s); fill(d.ink); });
        y += 10;
        if (mode === 'pay' && current.amount) { setText(110 * TS, 600); fill(d.ink); txt(x, current.amount, P, y + 60); y += 120; }
        if (d.tagline) { setItalic(46 * TS); fill(rgba(d.ink, 0.7)); txt(x, d.tagline, P, y + 30); y += 70; }
        fill(d.ink); x.fillRect(P, y + 30, maxW, 3);
        const rowsTop = H - P - Math.max(0, dRows.length - 1) * 64 * TS;
        const qTop = y + 80, qS = Math.min(maxW * 0.62, rowsTop - 110 - qTop);
        qr(P, qTop, qS, !lightBg(d.bg), 16);
        fill(rgba(d.ink, 0.55)); setLabel(22); txt(x, 'NASKENUJTE FOTOAPARÁTEM', P + qS + 40, qTop + 30, 4);
        detailRowsWrap(dRows, P, H - P - Math.max(0, dRows.length - 1) * 64 * TS, maxW, 40, 64, d.bg);
      } else if (d.layout === 'block') {
        const bh = Math.round(H * 0.44);
        fill(d.accent); x.fillRect(0, 0, W, bh);
        const bInk = on(d.accent);
        fill(rgba(bInk, 0.7)); setLabel(24); txt(x, kicker, P, P + 20, 7);
        fill(bInk); const hd = fitWrap(x, head, maxW, 180 * NS, 70, 2, setName);
        let y = P + 40 + hd.s * 0.85; hd.lines.forEach((l) => { txt(x, l, P, y, nameTr(hd.s)); y += hd.s * 0.92; });
        if (d.tagline) { setItalic(44 * TS); fill(rgba(bInk, 0.8)); txt(x, d.tagline, P, Math.min(y + 20, bh - 150)); }
        const qS = 560; const qX = (W - qS) / 2, qY = bh - qS * 0.32;
        x.save(); x.shadowColor = 'rgba(0,0,0,0.18)'; x.shadowBlur = 40; x.shadowOffsetY = 14; fill('#ffffff'); roundRect(x, qX, qY, qS, qS, 30); x.fill(); x.restore();
        qr(qX, qY, qS, true, 30);
        let ty = qY + qS + 90;
        if (mode === 'pay' && current.amount) { setText(96 * TS, 600); fill(d.ink); txt(x, current.amount, W / 2, ty, 0, 'center'); ty += 80; }
        detailRowsWrap(dRows, W / 2, Math.max(ty, H - P - Math.max(0, dRows.length - 1) * 60 * TS), maxW, 38, 60, d.bg, 'center');
      } else if (d.layout === 'frame') {
        const inset = 56; x.strokeStyle = rgba(d.ink, 0.6); x.lineWidth = 3; x.strokeRect(inset, inset, W - inset * 2, H - inset * 2);
        x.strokeRect(inset + 14, inset + 14, W - (inset + 14) * 2, H - (inset + 14) * 2);
        fill(labelColor(d.bg)); setLabel(24); txt(x, kicker, W / 2, P + 70, 8, 'center');
        fill(d.ink); const hd = fitWrap(x, head, maxW - 60, 150 * NS, 60, 2, setName);
        let y = P + 100 + hd.s * 0.85; hd.lines.forEach((l) => { txt(x, l, W / 2, y, nameTr(hd.s), 'center'); y += hd.s * 0.95; });
        if (d.tagline) { setItalic(42 * TS); fill(rgba(d.ink, 0.7)); txt(x, d.tagline, W / 2, y + 6, 0, 'center'); y += 60; }
        const rowsTop = H - P - 40 - Math.max(0, dRows.length - 1) * 58 * TS - (mode === 'pay' && current.amount ? 110 : 0);
        const qS = Math.min(600, rowsTop - 120 - (y + 40)); const qX = (W - qS) / 2, qY = y + 50;
        qr(qX, qY, qS, !lightBg(d.bg), 10);
        fill(d.accent && ratio(d.accent, d.bg) >= 2 ? d.accent : d.ink); const b = 46, g = 26, th = 7;
        [[qX - g, qY - g, 1, 1], [qX + qS + g, qY - g, -1, 1], [qX - g, qY + qS + g, 1, -1], [qX + qS + g, qY + qS + g, -1, -1]].forEach(([cx, cy, sx, sy]) => { x.fillRect(sx > 0 ? cx : cx - b, sy > 0 ? cy : cy - th, b, th); x.fillRect(sx > 0 ? cx : cx - th, sy > 0 ? cy : cy - b, th, b); });
        let ty = rowsTop;
        if (mode === 'pay' && current.amount) { setText(84 * TS, 600); fill(d.ink); txt(x, current.amount, W / 2, ty, 0, 'center'); ty += 100; }
        detailRowsWrap(dRows, W / 2, ty, maxW - 60, 36, 58, d.bg, 'center');
      } else { // aura
        const inkA = aura(x, W, H, d);
        fill(inkA); x.globalAlpha = 0.75; setLabel(24); txt(x, kicker, P, P + 20, 7); x.globalAlpha = 1;
        const hd = fitWrap(x, head, maxW, 170 * NS, 64, 2, setName);
        let y = P + 40 + hd.s * 0.85; hd.lines.forEach((l) => { txt(x, l, P, y, nameTr(hd.s)); y += hd.s * 0.92; });
        if (d.tagline) { setItalic(44 * TS); x.globalAlpha = 0.85; txt(x, d.tagline, P, y + 10); x.globalAlpha = 1; y += 60; }
        const pS = 620, pX = (W - pS) / 2, pY = y + 70;
        glass(x, pX - 30, pY - 30, pS + 60, 50); qr(pX, pY, pS, true, 28);
        let ty = pY + pS + 120;
        if (mode === 'pay' && current.amount) { setText(84 * TS, 600); fill(inkA); txt(x, current.amount, W / 2, ty, 0, 'center'); ty += 90; }
        const keep = d.accent; d.accent = inkA;
        detailRowsWrap(dRows, W / 2, Math.max(ty, H - P - Math.max(0, dRows.length - 1) * 58 * TS), maxW, 36, 58, d.bg, 'center', inkA);
        d.accent = keep;
      }
      return cvs;

      function detailRowsWrap(rows, X, top, mW, size, lh, bg, align, inkC) {
        rowsSrc = rows;
        detailRows(X, top, mW, size, lh, bg, labelW(size), align, inkC);
        rowsSrc = details;
      }
    }

    // ---------------- SAMOLEPKA ----------------
    {
      const P = 70;
      if (d.layout === 'badge') {
        fill(d.accent); roundRect(x, 0, 0, W, H, 90); x.fillRect(0, 0, W, H);
        const bInk = on(d.accent);
        const qS = 760, qX = (W - qS) / 2, qY = P + 20;
        qr(qX, qY, qS, true, 46);
        fill(bInk); const space = H - (qY + qS) - P;
        const hs = fitSize(x, head, W - P * 2.4, Math.min(170, space * 0.9) * NS, 50, setName, nameTr);
        txt(x, head, W / 2, qY + qS + (space + hs * 0.72) / 2 + 6, nameTr(hs), 'center');
      } else {
        fill('#ffffff'); x.fillRect(0, 0, W, H);
        const ring = d.accent && lum(d.accent) < 0.6 ? d.accent : d.ink;
        x.lineWidth = 52; x.strokeStyle = ring; roundRect(x, 26, 26, W - 52, H - 52, 110); x.stroke();
        const label = d.upper ? head : head.toLocaleUpperCase('cs');
        fill(ring); const hs = fitSize(x, label, W - 320, 96 * NS, 40, setName, (s) => s * 0.08);
        const ly = 140 + hs * 0.75; txt(x, label, W / 2, ly, hs * 0.08, 'center');
        const qS = Math.min(H - ly - 170, 720), qX = (W - qS) / 2;
        const keepInk = d.ink; d.ink = ring; qr(qX, ly + 50, qS, false); d.ink = keepInk;
      }
      return cvs;
    }

    function aura(x, W, H, d) {
      const g1 = x.createRadialGradient(W * 0.12, H * 0.1, 0, W * 0.12, H * 0.1, Math.max(W, H) * 0.75); g1.addColorStop(0, rgba(d.accent, 0.95)); g1.addColorStop(1, rgba(d.accent, 0));
      const g2 = x.createRadialGradient(W * 0.95, H * 1.05, 0, W * 0.95, H * 1.05, Math.max(W, H) * 0.7); g2.addColorStop(0, rgba(d.accent2, 0.9)); g2.addColorStop(1, rgba(d.accent2, 0));
      x.fillStyle = g1; x.fillRect(0, 0, W, H); x.fillStyle = g2; x.fillRect(0, 0, W, H);
      let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < (W * H) / 100; i++) { x.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)'; x.fillRect(rnd() * W, rnd() * H, 2, 2); }
      const avg = (lum(d.bg) + lum(d.accent) * 0.6 + lum(d.accent2) * 0.4) / 2;
      return avg > 0.35 ? '#111113' : '#ffffff';
    }
    function glass(x, X, Y, S, r) { x.fillStyle = 'rgba(255,255,255,0.18)'; roundRect(x, X, Y, S, S, r); x.fill(); x.strokeStyle = 'rgba(255,255,255,0.45)'; x.lineWidth = 2; x.stroke(); }
  }

  // ================= Start =================
  renderField(); update();
})();
</script>
