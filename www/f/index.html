<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>if(location.protocol==='http:'&&!/^(localhost|127\.|\[::1\])/.test(location.hostname))location.replace('https://'+location.host+location.pathname+location.search+location.hash)</script>
<script src="../bw.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060a">
<title>Fotky · Načti.me</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #07060a; --ink: #f4f2f8; --muted: #9b97ab; --line: rgba(255,255,255,.12); --sans: "Bricolage Grotesque", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body { padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; padding-block: 20px 40px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.logo { font-weight: 800; font-size: 22px; letter-spacing: -0.04em; color: var(--ink); text-decoration: none; }
.logo em { font-style: normal; font-weight: 300; color: var(--muted); }
.count { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
figure { margin: 0; border-radius: 18px; overflow: hidden; background: #121118; min-height: 200px; display: grid; place-items: center; }
figure img { width: 100%; height: auto; display: block; -webkit-touch-callout: default; opacity: 0; transition: opacity .4s; }
figure img.in { opacity: 1; }
figure.bad { color: var(--muted); font-size: 14px; padding: 40px 20px; text-align: center; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin: 0; }
.cta { display: grid; justify-items: center; gap: 10px; padding-top: 24px; border-top: 1px solid var(--line); text-align: center; }
.cta b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
.cta a { display: inline-block; padding: 14px 24px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; }
.empty { padding: 80px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { figure img { transition: none; } }
</style>
</head>
<body>
<main>
  <header><a class="logo" href="../">Načti<em>.me</em></a><span class="count" id="count"></span></header>
  <div id="list" style="display:grid;gap:14px"></div>
  <p class="hint" id="hint" hidden>Fotku uložíte podržením prstu (na počítači pravým tlačítkem).</p>
  <div class="cta"><b>Chcete taky takový kód?</b><a href="../app/">Vytvořit QR kód zdarma</a></div>
</main>
<script src="../config.js"></script>
<script>
(function () {
  var API = ((window.NACTI || {}).apiUrl || '').replace(/\/$/, '');
  // Starší fotky (nahrané před přechodem na Cloudflare) zůstávají dostupné na původní adrese.
  var OLD = 'https://smjplqxwqyraphfeqsyk.supabase.co/storage/v1/object/public/nacti-fotky/';
  var p = new URLSearchParams(location.search).get('p') || '';
  var ids = p.split('.').filter(function (id) { return /^[A-Za-z0-9]{12}$/.test(id); }).slice(0, 10);
  var list = document.getElementById('list');
  if (!ids.length) { list.innerHTML = '<div class="empty">Tady žádné fotky nejsou. Zkontrolujte, že jste naskenovali celý kód.</div>'; return; }
  document.getElementById('count').textContent = ids.length + (ids.length === 1 ? ' fotka' : ids.length < 5 ? ' fotky' : ' fotek');
  document.getElementById('hint').hidden = false;
  ids.forEach(function (id, i) {
    var fig = document.createElement('figure');
    var img = new Image();
    img.alt = 'Fotka ' + (i + 1);
    img.loading = i ? 'lazy' : 'eager';
    img.decoding = 'async';
    img.onload = function () { img.classList.add('in'); };
    var tries = API ? [API + '/f/' + id, OLD + id + '.jpg'] : [OLD + id + '.jpg'];
    img.onerror = function () { if (tries.length) { img.src = tries.shift(); return; } fig.classList.add('bad'); fig.textContent = 'Tuhle fotku se nepodařilo načíst.'; };
    img.src = tries.shift();
    fig.appendChild(img); list.appendChild(fig);
  });
})();
</script>
</body>
</html>
