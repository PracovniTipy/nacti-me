# 0) Nasadí API na Cloudflare (fotky, AI, dynamické kódy, Pro). Potřebuje GitHub secret CLOUDFLARE_API_TOKEN.
#    Volitelně ANTHROPIC_API_KEY (AI návrhy) a STRIPE_SECRET_KEY (předplatné). Bez tokenu se krok přeskočí.
# 1) Zveřejní aplikaci na GitHub Pages (adresa pro Microsoft Store a instalaci z prohlížeče)
# 2) Sestaví Android aplikaci (.apk na zkoušku, .aab pro Google Play)
name: Aplikace
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: nasazeni
  cancel-in-progress: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  api:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 22 }
      - name: Nasadit API na Cloudflare
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -eo pipefail
          # Z vloženého textu vezmi jen samotný token a ID účtu (bez mezer a řádků navíc)
          TOK=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE '[A-Za-z0-9_-]{40,}' | head -1 || true)
          [ -n "$TOK" ] && export CLOUDFLARE_API_TOKEN="$TOK" && echo "::add-mask::$TOK"
          ACC=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1 || true)
          if [ -n "$ACC" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACC"; else unset CLOUDFLARE_ACCOUNT_ID; fi
          npm ci --no-audit --no-fund
          W="npx wrangler"
          LIST='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name===process.argv[1]);console.log(x?x.uuid:"")})'
          ID=$($W d1 list --json | node -e "$LIST" nacti-eu)
          if [ -z "$ID" ]; then
            $W d1 create nacti-eu --location weur
            ID=$($W d1 list --json | node -e "$LIST" nacti-eu)
            # první pokus založil prázdnou databázi v USA – smazat (je prázdná, nic se neztratí)
            OLD=$($W d1 list --json | node -e "$LIST" nacti); [ -n "$OLD" ] && $W d1 delete nacti -y || true
          fi
          sed -i "s/DATABASE_ID/$ID/" wrangler.toml
          $W r2 bucket create nacti-fotky 2>/dev/null || true
          $W d1 execute nacti-eu --remote --file schema.sql -y
          $W d1 execute nacti-eu --remote --command "ALTER TABLE accounts ADD COLUMN promo_until INTEGER" -y 2>/dev/null || true
          $W d1 execute nacti-eu --remote --command "ALTER TABLE accounts ADD COLUMN plan TEXT" -y 2>/dev/null || true
          $W d1 execute nacti-eu --remote --command "DELETE FROM usage WHERE (kind <> 'aim' AND day < date('now', '-2 days')) OR (kind = 'aim' AND day < strftime('%Y-%m', 'now', '-2 months'))" -y
          $W d1 execute nacti-eu --remote --command "INSERT OR IGNORE INTO accounts (id, email, sub_status, created_at) VALUES ('owner', 'BrosWars Studio', 'active', 0); INSERT OR IGNORE INTO tokens (hash, account_id, created_at) VALUES ('f987bba44f5abbe0431bc862c9a1eca6c9d0ceab91811b2d0227f0f4b027fad0', 'owner', 0);" -y  # majitel: Pro zdarma
          $W deploy | tee deploy.log
          AK=$(printf '%s' "$ANTHROPIC_API_KEY" | grep -oE 'sk-ant-[A-Za-z0-9_-]{20,}' | head -1 || true)
          SK=$(printf '%s' "$STRIPE_SECRET_KEY" | grep -oE '(sk|rk)_(live|test)_[A-Za-z0-9]{20,}' | head -1 || true)
          echo "AI klíč nalezen: $([ -n "$AK" ] && echo ano || echo ne), Stripe klíč nalezen: $([ -n "$SK" ] && echo ano || echo ne)"
          if [ -n "$AK" ]; then echo "::add-mask::$AK"; printf '%s' "$AK" | $W secret put ANTHROPIC_API_KEY; fi
          if [ -n "$SK" ]; then echo "::add-mask::$SK"; printf '%s' "$SK" | $W secret put STRIPE_SECRET_KEY; fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "API: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  web:
    needs: api
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Doplnit adresu API
        if: needs.api.outputs.url != ''
        env:
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          printf "window.NACTI = { apiUrl: '%s' };\n" "$API_URL" > www/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doplnit adresu API
        if: needs.api.outputs.url != ''
        env:
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          printf "window.NACTI = { apiUrl: '%s' };\n" "$API_URL" > www/config.js
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx cap sync android
      - name: Klíč pro Google Play
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/upload.p12"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"; fi
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug bundleRelease --no-daemon
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nacti-me-Android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
